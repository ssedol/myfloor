name: 주차 알림 발송

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 만기 알람 발송
        run: |
          HTTP_CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" -X GET https://myfloor.website/api/cron/notify \
            -H "Authorization: Bearer ${{ secrets.ALARM_CRON_SECRET }}" \
            --max-time 30)
          echo "HTTP $HTTP_CODE"
          cat /tmp/body.txt
          if [ "$HTTP_CODE" != "200" ]; then
            echo "크론 엔드포인트 오류: HTTP $HTTP_CODE"
            exit 1
          fi
